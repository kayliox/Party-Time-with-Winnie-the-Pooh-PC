; SpartaRecomp PC compatibility layer settings for Disney's Party Time with Winnie the Pooh (PC, UK English, 2002).
; Copied next to WTP.exe by scripts/install-pc-game.ps1. Addresses below are valid only for WTP.exe with
; SHA-256 22653cb577d1d8309d58d4e02f2c83f73b6e65e483550733d698b56301341c42 (the install script checks it, and every
; patch re-checks its original bytes before writing).

[VirtualCd]
; the game scans for a CD-ROM drive holding Datas\INI\Menu.ini and then runs from <drive>:\Datas
Enable=1
Root=cd
Drive=auto

[Registry]
; launcher settings (video mode, keys, pads) live in registry.ini next to the game instead of the real registry
Virtualize=HKCU\SOFTWARE\Disney Interactive
Store=registry.ini

[Display]
; Most of these can be changed in the game: press F1 (or Back+Start on a gamepad) for the settings overlay.
; borderless | fullscreen (exclusive; falls back to borderless if the display mode is refused) | windowed | game
Mode=borderless
; 0 = monitor size. Borderless always covers the monitor: a smaller size is rendered and scaled up to it
Width=0
Height=0
; exclusive fullscreen only: refresh rate in Hz, 0 = the driver's default for the mode
Refresh=0
; hor+ (ultrawide: full width 3D, centred 2D) | 4:3 (pillarbox) | stretch
Aspect=hor+
; -1 = monitor refresh rate, 0 = unlimited (1000 fps guard), N = N fps
; 120 = this engine's own logic rate (1/120 s ticks): every frame is exactly one tick. Higher works without hangs
; but some frames then carry no tick (uneven motion); 60 also gives exactly two ticks per frame.
FpsLimit=120
; MSAA applies only when Supersample=1 and SideFill=black (the offscreen scene below cannot be multisampled in D3D8)
MSAA=4
; (supersampling needs a restart: the game lays out menus once at its render size)
; 2 = the game renders at twice the window size and every frame is averaged down 2x2: smooth edges everywhere,
; including the cut-out trees, bushes and sprites that MSAA leaves jagged. 1 = off
Supersample=2
; hor+ side areas where a level has no geometry (the board's edges): black, or ambient = a heavily blurred copy of the
; previous frame (soft scene colours instead of black holes; the game's geometry still covers it everywhere else)
SideFill=ambient
; hor+: the HUD drawn on top of the 3D (board portrait, minigame portraits and scores, progress rope) moves out
; towards the screen corners in proportion to the wider picture; dialogs, menus and 2D screens stay as they are.
; HudBand = top/bottom band (% of the height) a HUD group must sit in, HudMaxWidth = widest group that moves (% of
; the 4:3 width), HudMinScene = 3D triangles a frame needs, HudMargin = gap (px at 1920 wide) that still joins pieces
HudSpread=1
HudBand=30
HudMaxWidth=50
HudMinScene=100
HudMargin=24
; 0 = the game's own (point) filtering, 1 = bilinear, 2-16 = anisotropic
Anisotropy=16
Depth24=1
HideCursor=1
; 1 = keep running when another window is in front (the game pauses itself otherwise)
RunInBackground=0
WindowClass=D3DWindow

[Textures]
; HD replacement pack: folder of <hash>.png next to the game (scripts/build-texture-pack.py). Missing = original.
Pack=textures
; 0 = keep the pack but show the game's own textures (switchable live in the F1 overlay, for comparison)
Enable=1
; 1 = save every texture the pack does not cover to <Pack>\dump while playing (input for the next pack build)
Dump=0
; 1 = smooth edges for one-colour replacements with soft alpha (the 8x font sheets): the game cuts text out with an
; alpha test (hard pixel steps even on HD glyphs); the layer blends those draws instead. 0 = the game's own way.
SoftEdges=1

[Autosave]
; The game saves only from Adventure > Pause > Save game, so quitting loses everything since then. The layer watches the
; live profile (name, Adventure board/round/hunny pots, Multiplayer state; the board copies its state there every round)
; and, when it changed and stayed unchanged for StableMs, does what the game's own save action FUN_0046d0f0 does: copy
; the 0x50 bytes to the save block and call FUN_00478200(slot) (cdecl), slot = the u32 at ArgVar. Also on window close
; (Alt+F4). Skipped when the save file's slot holds a different profile (name compared, NameLen bytes).
Enable=1
Watch=0x730050:0x50
Copy=0x730050:0x7300a0:0x50
Call=0x478200
; first bytes of the save function (mov eax,0x2000; call _chkstk): refuse to call anything else
CallCheck=B8 00 20 00 00 E8 E6 7C 04 00
ArgVar=0x72c16c
ArgMax=3
File=DPTWP.sav
; offset of slot 1 in the file : bytes per slot
FileSlots=0x100:0x50
NameLen=10
StableMs=1500
MinIntervalMs=5000

[Overlay]
; F1 / Back+Start settings overlay (Dear ImGui). Every change made there is written back to this file at once.
Enable=1
; small frame-rate counter in the top-left corner
FpsCounter=0

[Game]
; the game's internal render size (it maps the PS1 512x240 coordinate space onto it): FUN_00485e76 sets them
RenderWidthVar=0x01c67494
RenderHeightVar=0x0073d3f8
; width of the game's 2D space in its own units (PS1 screen: 512): hor+ widens the 3D culling by the side areas
ScreenUnitsX=512

[Input]
AutoPads=1
RegistryKey=HKCU\SOFTWARE\Disney Interactive\Disney's Party Time with Winnie the Pooh\1.0
PadCountValue=NbPad
PlayerCountValue=NbPlayer
PlayerDeviceValueFormat=ComboIndex%d
PadGuidValueFormat=CONTROL_GUID_%d%d
KeyboardDevices=2
MaxPlayers=4

[Watch]
; read-only values logged with every 10 s heartbeat (spartacompat.log), for speed checks
GameClock=0x00543770:i32
FrameDelta=0x00543774:i32
LastFrameMs=0x01c67dc4:u32
; the profile in play (loaded from DPTWP.sav slot n into 0x730050): movie mask and the first four mini-game unlock
; bytes (scripts/pc_save_edit.py unlock-all: 127 and 16843009 = 01 01 01 01)
ProfileMovies=0x0073009c:u32
ProfileUnlocks=0x0073006a:u32

[Patches]
; name = virtual address : original bytes : new bytes
; FUN_004868f8 waits until 33 ms (0x21) passed since the last frame (30 fps cap); the layer paces frames instead.
FrameCap30=0x0048691e:21:00
; Sites that truncate the per-frame delta (16.16, 0x10000 = 1/120 s) to whole ticks: above 120 fps (60 fps for >>17)
; they read 0 and stop (cutscene WAIT/spline/anim durations hang, rotations and timers freeze). Each now loads the
; layer's carried tick count ({ticksN}, updated by the store_delta_ticks hook) and its shift becomes NOPs.
TicksRotation41cac7=0x0041cac7:a178375400c1f80d:a1{ticks13}909090
TicksBlink422304=0x00422304:8b0d783754008b442414c1f910:8b0d{ticks16}8b442414909090
TicksTimer42ef64=0x0042ef64:8b15783754008b41085fc1fa10:8b15{ticks16}8b41085f909090
TicksRtcWait437413=0x00437413:a1783754008b4e349981e2ffff010003c2c1f811:a1{ticks17}8b4e349981e2ffff010003c2909090
TicksRtcDuration437a50=0x00437a50:a178375400a90000ffff740fc1f810:a1{ticks16}a9ffffffff740f909090
TicksRtcDuration437c40=0x00437c40:a178375400a90000ffff74138b0d4c557200c1f810:a1{ticks16}a9ffffffff74138b0d4c557200909090
TicksRotation451910=0x00451910:a178375400c1f810:a1{ticks16}909090
TicksPadTimer4803ac=0x004803ac:a1783754008b4e28c1f810:a1{ticks16}8b4e28909090
; FUN_0040f830 copies the 3D culling rectangle (x 0..512) into 0x545f80/84; the rewritten tail (it had 14 bytes of
; padding) widens x by {ws_ext} units per side for hor+ (0 = unchanged): xmin -= ext, xmax += ext.
CullRectHorPlus=0x0040f853:8b08890d805f54008b50048915845f5400c39090909090909090909090cccccc:8b08662b0d{ws_ext}890d805f54008b5004660315{ws_ext}8915845f5400c3
; FUN_0040d130 builds the view frustum (4 side planes from the screen corners +-W/2, +-H/2 at distance D, and the
; diagonal factor 0x543830 for object bounds) from the screen width 512 at 0x52ce58: objects at the hor+ sides were
; culled and popped in mid-screen (the board's well, fences, logs). Its first instruction now loads {ws_units}
; (512 + 2 * extension = 934 at 21.5:9; 512 until the window is known). Check: [Watch] 0x543830 = 32904 (19251 = 4:3).
FrustumHorPlus=0x0040d133:0fbf0558ce5200:a1{ws_units}9090
; "Would you like to save your game?" (text $67) opened with the cursor on No: FUN_0047d5b0(action) selects the item
; with that action, and the three save prompts (FUN_0046ce00 twice, FUN_0046d1e0's caller) passed the No action.
; Now they pass the Yes action (0xf / 0x15). Delete, overwrite and quit prompts keep No as the default.
SavePromptYes1=0x0046ce29:6a14:6a0f
SavePromptYes2=0x0046ce51:6a0a:6a0f
SavePromptYes3=0x0046d3b5:6a0a:6a15
; Optional: the title-screen cheat (Up, Down, Left, Right, Cross on a gamepad; the keyboard never reaches the pad
; word it reads) sets 0x72C1BC = 1: every NEW profile then starts with all mini-game levels and Multiplayer boards
; 2 and 3. Remove the ";" to have it on from the start. Existing profiles: scripts/pc_save_edit.py --preset unlock-all
;UnlockNewProfiles=0x0072c1bc:00:01

[Hooks]
; name = virtual address : original bytes : built-in[:argument]
; FUN_00489daa / FUN_0048d8fb compute the frame delta as (last frame in whole ms) * 0x780000 / 1000 (16.16 fixed point,
; 0x10000 = one 1/120 s tick). frame_delta returns the precise frame time in whole ticks (quantum 0x10000, remainder
; carried): about 30 systems (black-bar loading transition FUN_00452f40, minigame timers, camera moves, cutscene steps)
; count "delta >> 16" ticks per frame and stop when a frame is shorter than one tick (the loading hang above 120 fps).
PreciseDelta=0x00489daa:558bece83f980000:frame_delta:0x780000:0x10000
PreciseDelta2=0x0048d8fb:558bece8ee5c0000:frame_delta:0x780000:0x10000
; FUN_0040a180's final "DAT_00543778 = timescale * delta >> 8" store also updates the carried tick counts
DeltaTicks=0x0040a302:a378375400:store_delta_ticks:0x00543778
; FUN_00485e21 is the game's printf-style debug output, an empty stub in this release (613 callers): routed into
; spartacompat.log as "game: ..." (memory card "CDDHCard::Read/Write", level loads, streaming), repeats folded, capped
DebugPrint=0x00485e21:558bec5dc3:debug_print
