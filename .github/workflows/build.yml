# Builds the fix and its setup from this repository on every push and pull request (tests and the publish audit first);
# pushing a tag "v1.2.3" also publishes the setup as a GitHub release, so every download is built from public source.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests and publish audit
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python scripts/test_pc_save_edit.py
          python scripts/test_pc_regression.py
          python scripts/test_audit_public.py
          python scripts/audit_public.py .

      - name: Toolchain (pinned llvm-mingw, SHA-256 checked)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-toolchains.ps1 -Only llvm-mingw

      - name: Build the fix and the setup
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          powershell -ExecutionPolicy Bypass -File scripts/build-pc-release.ps1 -Version $v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 build/pc-installer/*.exe, build/pc-compat/d3d8.dll | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: build/pc-installer/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME build/pc-installer/PartyTimePooh-PCFix-Setup.exe
          --title "$env:GITHUB_REF_NAME"
          --notes "Download PartyTimePooh-PCFix-Setup.exe and run it. You need your own original game CD (UK English PC edition) or a disc image made from it; see the README."
